 
services:
  db:
    image: postgres:17
    container_name: voting_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djole"]
      interval: 3s
      timeout: 3s
      retries: 5
    

  backend:
    build: ./backend
    container_name: voting_backend
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"


  frontend:
    build: ./frontend
    container_name: voting_frontend
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
